                <input

                  type="search"
                  placeholder="Search laptops, GPUs, monitors..."

                /><button type="submit" aria-label="Search">

                </button>
              </form>
            </div>
            <div class="col-sm-3 col-xs-12">

        <div class="row">
          <div class="col-sm-6 col-sm-offset-3">
            <form class="form-panel" action="#" method="post">
              <h1>Create account</h1>
              <label for="name">Full name</label
              ><input id="name" required /><label for="email"
                >Email address</label
              ><input id="email" type="email" required /><label for="password"
                >Password</label
              ><input id="password" type="password" required /><button
                class="button"
                type="submit"
              >
                Create account
